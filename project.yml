name: Volocal
options:
  bundleIdPrefix: com.localiosllm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

packages:
  llama-swift:
    url: https://github.com/mattt/llama.swift.git
    exactVersion: "2.10549.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.8"

targets:
  Volocal:
    type: application
    platform: iOS
    sources:
      - path: Volocal
      - path: Volocal/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localiosllm.volocal
        INFOPLIST_FILE: Volocal/Info.plist
        CODE_SIGN_ENTITLEMENTS: Volocal/Volocal.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: llama-swift
        product: LlamaSwift
      - package: FluidAudio
        product: FluidAudio
    info:
      path: Volocal/Info.plist
      properties:
        CFBundleName: Volocal
        CFBundleDisplayName: Volocal
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Volocal needs microphone access for voice conversations."
    entitlements:
      path: Volocal/Volocal.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.developer.kernel.increased-memory-limit: true
